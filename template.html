<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a2a43">
<title>Surge Rider 3D – Jetski Chaos</title>
<style>
html,body{margin:0;height:100%;background:#0a2a43;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));pointer-events:none}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#touch .grp{display:flex;gap:12px}
.tb{pointer-events:auto;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);color:#fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(2px)}
.tb.on{background:rgba(255,255,255,.42)}
#boostBtn{background:rgba(255,150,0,.35);font-size:14px}
#brakeBtn{font-size:13px}
#camBtn,#fsBtn{position:fixed;top:calc(128px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:52px;height:52px;font-size:12px;display:none}
#fsBtn{top:calc(188px + env(safe-area-inset-top))}

#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;
 background:linear-gradient(180deg,#5fb4e6 0%,#9fd3f0 38%,#1b8aa6 38.2%,#0c5f7a 70%,#08465c 100%);transition:opacity .6s ease}
#loader.done{opacity:0;pointer-events:none}
#loader h1{margin:0;font-size:clamp(34px,8vw,64px);font-weight:900;letter-spacing:1px;color:#ffd400;text-shadow:0 4px 0 #00314a,0 0 24px rgba(0,0,0,.25);-webkit-text-stroke:2px #00314a}
#loader h1 span{color:#fff}
.ld-sub{font-weight:700;opacity:.9;margin-top:-8px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.ld-scene{position:relative;width:min(80vw,360px);height:150px;overflow:hidden}
.ld-ski{position:absolute;left:50%;top:22px;width:150px;margin-left:-75px;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.ld-wave{position:absolute;left:-50%;width:200%;height:60px;background-repeat:repeat-x;background-size:120px 60px}
.ld-wave.w1{bottom:18px;opacity:.55;animation:wave 2.4s linear infinite;
 background-image:radial-gradient(circle at 60px -28px,transparent 44px,#bdf3ff 45px,#bdf3ff 50px,transparent 51px)}
.ld-wave.w2{bottom:0;animation:wave 1.6s linear infinite reverse;
 background-image:radial-gradient(circle at 60px -24px,transparent 42px,#ffffff 43px,#ffffff 47px,transparent 48px)}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.ld-spray{position:absolute;left:calc(50% - 70px);top:86px;width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;animation:spray 0.9s ease-out infinite}
.ld-spray.s2{animation-delay:.3s;left:calc(50% - 64px)}.ld-spray.s3{animation-delay:.6s;left:calc(50% - 76px)}
@keyframes spray{0%{transform:translate(0,0) scale(1);opacity:.9}100%{transform:translate(-50px,-30px) scale(.3);opacity:0}}
.ld-row{display:flex;align-items:center;gap:12px}
.ld-spin{width:26px;height:26px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#ffd400;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-track{width:min(70vw,300px);height:14px;border-radius:8px;background:rgba(0,0,0,.3);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
#ldBar{height:100%;width:2%;border-radius:8px;background:linear-gradient(90deg,#ffd400,#ff7a1a);transition:width .25s ease}
#ldMsg{font-weight:700;min-height:1.3em;text-shadow:0 2px 4px rgba(0,0,0,.5)}
#ldTip{font-size:14px;opacity:.85;max-width:80vw;min-height:2.4em;text-shadow:0 2px 4px rgba(0,0,0,.5)}
#ldErr{display:none;max-width:min(88vw,460px);background:rgba(120,10,0,.85);border:2px solid #ffb4a0;border-radius:12px;padding:14px 16px;line-height:1.45;font-size:15px}
#loader.error .ld-spin,#loader.error .ld-track{display:none}
</style>
</head>
<body>

<div id="loader">
  <h1>SURGE RIDER <span>3D</span></h1>
  <div class="ld-sub">Jetski chaos. Big air. Bigger wipeouts.</div>
  <div class="ld-scene">
    <svg class="ld-ski" viewBox="0 0 150 100" aria-hidden="true">
      <path d="M8 78 Q4 66 22 64 L118 60 Q140 58 146 70 Q130 86 96 88 L26 88 Q12 88 8 78Z" fill="#ffb300" stroke="#00314a" stroke-width="3"/>
      <path d="M14 82 L140 74" stroke="#1f2328" stroke-width="5" stroke-linecap="round"/>
      <path d="M100 62 L112 40" stroke="#1f2328" stroke-width="5" stroke-linecap="round"/>
      <path d="M104 40 L122 38" stroke="#ccc" stroke-width="5" stroke-linecap="round"/>
      <path d="M46 62 Q50 50 62 50 L80 52 Q86 60 78 62Z" fill="#15171a"/>
      <path d="M64 56 L72 30" stroke="#24357a" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="74" cy="26" rx="11" ry="13" fill="#ff5a1f"/>
      <path d="M80 22 L106 40" stroke="#e9b98a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="78" cy="8" r="9" fill="#fff" stroke="#00314a" stroke-width="2"/>
      <path d="M80 4 Q88 6 87 12 L80 11Z" fill="#223344"/>
    </svg>
    <div class="ld-spray"></div><div class="ld-spray s2"></div><div class="ld-spray s3"></div>
    <div class="ld-wave w1"></div><div class="ld-wave w2"></div>
  </div>
  <div class="ld-row"><div class="ld-spin"></div><div id="ldMsg">Loading…</div></div>
  <div class="ld-track"><div id="ldBar"></div></div>
  <div id="ldTip"></div>
  <div id="ldErr"></div>
</div>
<div id="safe"></div>
<canvas id="hud"></canvas>
<div class="tb" id="camBtn">CAM</div>
<div class="tb" id="fsBtn">FULL</div>
<div id="touch">
  <div class="grp"><div class="tb" id="leftBtn">◀</div><div class="tb" id="rightBtn">▶</div></div>
  <div class="grp"><div class="tb" id="brakeBtn">BRAKE</div><div class="tb" id="boostBtn">NITRO</div></div>
</div>
<script type="text/plain" id="game-src">/*__GAME__*/</script>
<script>
(function(){
  var tips=['Tip: hold ↓ / BRAKE to stop completely','Tip: steer in the air to spin, let go to land straight','Tip: rocks and logs dent your hull, five hits and… boom','Tip: boost into rivals for a takedown','Tip: press C for the helmet camera','Tip: cyan pads give a free speed boost','Tip: the green cross repairs your hull, the blue orb is a shield','Tip: press Q to change graphics quality, F for fullscreen'],i=0,el=document.getElementById('ldTip');
  function tip(){ if(el){ el.textContent=tips[i++%tips.length]; } }
  tip(); var ti=setInterval(function(){ if(!document.getElementById('loader')) return clearInterval(ti); tip(); },2600);
  setTimeout(function(){ var m=document.getElementById('ldMsg'); var l=document.getElementById('loader'); if(l && !l.classList.contains('done') && !l.classList.contains('error') && m) m.textContent += ' (slow computer? hang on…)'; },20000);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(function(){
    try { var s=document.createElement('script'); s.textContent=document.getElementById('game-src').textContent; document.body.appendChild(s); }
    catch(e){ var b=document.getElementById('ldErr'); b.style.display='block'; b.textContent='The game could not start: '+e.message; }
  },30); }); });
})();
</script>
</body>
</html>
